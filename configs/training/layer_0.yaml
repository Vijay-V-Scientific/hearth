# Layer 0 — PPO locomotion policy (500 Hz low-level joint control)
# Success criterion 1: robust locomotion
name: hearth-ppo-locomotion
layer: 0
algorithm: ppo
control_rate_hz: 500
objectives:
  locomotion: 1.0
  loco_manipulation: 0.9
  dexterous_grasping: 0.85
  long_horizon_tasks: 0.7
  recovery: 0.8
notes: |
  Whole-body PD target policy. Targets 500 Hz low-level control.
  - Locomotion: 0.0-1.5 m/s, turns, 15 cm steps, <1 fall/1000 m, 150 N pushes
  - Contacts learned via actuator networks fit to real motor logs
  - Feet/fingertips use simplified primitive collisions
ppo:
  gamma: 0.99
  lam: 0.95
  clip_ratio: 0.2
  num_minibatches: 16
  update_epochs: 10
  learning_rate: 3.0e-4
  normalize_advantage: true
  n_steps_per_env: 24
  total_steps: 5.0e7
train:
  seed: 0
  device: cuda
  save_interval_steps: 1000
  eval_interval_steps: 10000
augment:
  terrain: true
  lighting: true
  texture_noise: true
  mass_perturbation: true
