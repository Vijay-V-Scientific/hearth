# Layer 1 — Diffusion loco-manipulation policy (whole-body + five-finger)
# Success criteria 1-3: locomotion, loco-manipulation, dexterous grasping
name: hearth-loco-manip-diffusion
layer: 1
algorithm: diffusion
control_rate_hz: 50
objectives:
  locomotion: 1.0
  loco_manipulation: 0.9
  dexterous_grasping: 0.85
  long_horizon_tasks: 0.7
  recovery: 0.8
notes: |
  Diffusion policy: samples a trajectory of whole-body action deltas.
  - Doors/drawers/cabinets: 90% success while standing
  - 85% grasp success on 500 held-out household objects
  - Recovery: 80% failure recovery without reset
horizon: 64
action_scale: 1.0
use_ema: true
ema_decay: 0.995
num_samples: 64
seed: 0
train:
  batch_size: 256
  epochs: 300
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  device: cuda
  checkpoint_interval: 25
augmented_observation:
  include_pointcloud: true
  include_camera: true
  include_language: false
augment:
  randomize_scene: true
  randomize_mass: true
  domain_randomization: true
