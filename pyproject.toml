[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth"
version = "0.1.0"
description = "Project HEARTH: humanoid household-manipulation research stack (sim-trained, hardware-transferred)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Vijay V", email = "vijay.v.scientific@gmail.com" }]
keywords = ["robotics", "reinforcement-learning", "humanoid", "isaac-sim", "sim2real"]
dependencies = [
    # Core numeric
    "numpy>=1.26,<2.2",
    "scipy>=1.12",
    "sympy>=1.12",
    # Data / I/O
    "h5py>=3.11",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "tqdm>=4.66",
    "loguru>=0.7",
    # viz (cpu-only)
    "matplotlib>=3.9",
    # Scene USD authoring (hearth.scene.writer) + parquet episode storage
    # (hearth.data.storage). Imported lazily so the core package still imports
    # without them, but the USD/parquet features and their tests need them.
    "usd-core>=24.11",
    "pyarrow>=15",
]

[project.optional-dependencies]
# Heavy / optional: only install in the Isaac Sim container.
isaac = [
    "isaacsim>=5.0",
    "isaaclab>=0.3",
]
# ML backends. Nothing in hearth/ imports these (the eval/locomotion code is
# Isaac-side); they are here for the training scripts that will use them. The
# CUDA build of torch is installed separately, so they are not core deps.
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
    "jax[cpu]>=0.4.30",
]
# Optional: ROS2 bridge (no real ROS2 package here — see hearth/deploy/ros2_bridge.py).
ros2 = []
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
hearth-scene = "hearth.scene.cli:main"
hearth-eval = "hearth.eval.cli:main"
hearth-data = "hearth.data.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hearth*"]

[tool.setuptools.package-data]
hearth = ["**/*.yaml", "**/*.yml", "**/*.json", "**/*.usd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Isaac Lab launch scripts must call launch_simulation() before importing Isaac
# symbols, so the imports that follow are legitimately not at the top of file.
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
